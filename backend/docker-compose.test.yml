services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_expense_tracker_test
    ports:
      - '5433:5432'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d auto_expense_tracker_test
      interval: 3s
      timeout: 3s
      retries: 10
